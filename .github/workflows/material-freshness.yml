name: Material Freshness Guard

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    check-wire-dist:
        name: Verify happy-wire dist is up-to-date
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build happy-wire
              run: pnpm --filter @slopus/happy-wire build

            - name: Check dist is up-to-date
              run: |
                  # Only check .js and .cjs files (deterministic).
                  # .d.cts / .d.mts Zod type declarations have non-deterministic
                  # property ordering across macOS vs Linux / pnpm environments.
                  CHANGED=$(git diff --name-only packages/happy-wire/dist/ | grep -v '\.d\.\(c\|m\)ts$' || true)
                  if [ -n "$CHANGED" ]; then
                      echo ""
                      echo "ERROR: happy-wire dist JS 文件已过期。"
                      echo "已变更文件："
                      echo "$CHANGED"
                      echo ""
                      echo "请在本地运行以下命令后重新提交："
                      echo "    pnpm --filter @slopus/happy-wire build"
                      exit 1
                  fi
                  echo "✅ happy-wire dist JS files are up-to-date."
