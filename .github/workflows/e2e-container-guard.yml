name: E2E Container Freshness Guard

on:
    pull_request:
        paths:
            - 'packages/happy-cli/**'
            - 'packages/happy-server/**'
            - 'packages/happy-wire/**'
            - 'test/docker/Dockerfile.happy-cli-test'
        branches: [main]
    push:
        paths:
            - 'packages/happy-cli/**'
            - 'packages/happy-server/**'
            - 'packages/happy-wire/**'
            - 'test/docker/Dockerfile.happy-cli-test'
        branches: [main]

jobs:
    guard-stale-e2e-container:
        name: Block merge if E2E container needs rebuild
        runs-on: ubuntu-latest
        timeout-minutes: 1

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Detect changed packages and fail if rebuild required
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  else
                      BASE_SHA="${{ github.event.before }}"
                  fi

                  CHANGED_PKGS=""
                  if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/happy-cli/'; then
                      CHANGED_PKGS="${CHANGED_PKGS} happy-cli"
                  fi
                  if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/happy-server/'; then
                      CHANGED_PKGS="${CHANGED_PKGS} happy-server"
                  fi
                  if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/happy-wire/'; then
                      CHANGED_PKGS="${CHANGED_PKGS} happy-wire"
                  fi

                  if [ -n "$CHANGED_PKGS" ]; then
                      REBUILD_MSG="E2E 容器需要重建（变更包：${CHANGED_PKGS# }）"
                      # PR 场景：merge gate，硬阻塞，防止落后容器随 PR 合入 main。
                      # push-to-main 场景：本项目走直推 main + tag 工作流（非 PR），
                      #   容器重建在各迭代 release 流程中独立完成（QA Step 0a A3 兜底硬阻塞），
                      #   此处只发 warning 不阻断——否则每个含 cli/server/wire 的迭代直推都会误伤。
                      if [ "${{ github.event_name }}" = "pull_request" ]; then
                          echo "::error file=test/docker/Dockerfile.happy-cli-test::${REBUILD_MSG}"
                      else
                          echo "::warning file=test/docker/Dockerfile.happy-cli-test::${REBUILD_MSG}"
                      fi
                      echo ""
                      echo "本次变更影响了 happy-cli/server/wire 包，E2E 容器镜像必须在 QA 前重建："
                      echo ""
                      echo "  docker build \\"
                      echo "    --build-arg GIT_HASH=\$(git rev-parse HEAD) \\"
                      echo "    -t happy-cli-test:latest \\"
                      echo "    -f test/docker/Dockerfile.happy-cli-test ."
                      echo ""
                      echo "重建完成后，在 release 流程中加入 e2e-container-rebuild target。"
                      echo "若 E2E 容器未更新，QA Step 0a A3 将硬阻塞测试。"
                      echo ""
                      if [ "${{ github.event_name }}" = "pull_request" ]; then
                          exit 1
                      fi
                      echo "（直推 main 工作流：此为 warning，不阻断。"
                      echo " 容器新鲜度由 release 流程重建 + QA Step 0a A3 双重保障。）"
                      exit 0
                  fi

                  echo "✅ E2E 容器无需重建（本次变更不涉及 happy-cli/server/wire）"
