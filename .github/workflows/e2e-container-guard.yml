name: E2E Container Freshness Guard

on:
    pull_request:
        paths:
            - 'packages/happy-cli/**'
            - 'packages/happy-server/**'
            - 'packages/happy-wire/**'
        branches: [main]
    push:
        paths:
            - 'packages/happy-cli/**'
            - 'packages/happy-server/**'
            - 'packages/happy-wire/**'
        branches: [main]

jobs:
    warn-stale-e2e-container:
        name: Warn if E2E container may be stale
        runs-on: ubuntu-latest
        timeout-minutes: 1

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Detect changed packages and warn
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  else
                      BASE_SHA="${{ github.event.before }}"
                  fi

                  CHANGED_PKGS=""
                  if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/happy-cli/'; then
                      CHANGED_PKGS="${CHANGED_PKGS} happy-cli"
                  fi
                  if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/happy-server/'; then
                      CHANGED_PKGS="${CHANGED_PKGS} happy-server"
                  fi
                  if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/happy-wire/'; then
                      CHANGED_PKGS="${CHANGED_PKGS} happy-wire"
                  fi

                  if [ -n "$CHANGED_PKGS" ]; then
                      echo "::warning file=test/docker/Dockerfile.happy-cli-test::E2E 容器已过期（变更包：${CHANGED_PKGS# }），请在合并前重建（docker build -f test/docker/Dockerfile.happy-cli-test -t happy-cli-test:latest .）"
                  fi
